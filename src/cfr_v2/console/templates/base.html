<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if running %}({{ running }} running) {% endif %}{% block title %}{{ title or "Pipeline" }}{% endblock %} · CFR console</title>
  <meta name="csrf-token" content="{{ csrf }}">
  <meta name="theme-color" content="#F7F8F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#333333" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <script>
    try { const t = localStorage.getItem("cfr-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ url_for('static', path='console.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='console.js') }}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  <a class="skip" href="#main">Skip to content</a>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-external" viewBox="0 0 16 16"><path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V13H3V5h3.5"/></symbol>
    <symbol id="i-theme" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11A5.5 5.5 0 0 0 8 2.5Z" fill="currentColor"/></symbol>
    <symbol id="i-menu" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></symbol>
    <symbol id="i-pipeline" viewBox="0 0 16 16"><circle cx="3" cy="8" r="1.75"/><circle cx="8" cy="8" r="1.75"/><circle cx="13" cy="8" r="1.75"/><path d="M4.75 8h1.5M9.75 8h1.5"/></symbol>
    <symbol id="i-jobs" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="m5 6.5 2 1.5-2 1.5M8.5 10.5H11"/></symbol>
    <symbol id="i-cases" viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.4 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5Z"/></symbol>
    <symbol id="i-releases" viewBox="0 0 16 16"><path d="M2.5 3.5v4l6 6 5-5-6-6h-4a1 1 0 0 0-1 1Z"/><circle cx="5.5" cy="5.5" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-intake" viewBox="0 0 16 16"><path d="M8 2.5v6M5.5 6 8 8.5 10.5 6M2.5 9.5h3l1 1.5h3l1-1.5h3V12a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 2.5 12Z"/></symbol>
    <symbol id="i-routing" viewBox="0 0 16 16"><path d="M2.5 8h3.5l4-4.5h3.5M6 8l4 4.5h3.5M12 2l1.5 1.5L12 5M12 11l1.5 1.5L12 14"/></symbol>
    <symbol id="i-procedures" viewBox="0 0 16 16"><path d="M3 3.5A1.5 1.5 0 0 1 4.5 2H13v9.5H4.5A1.5 1.5 0 0 0 3 13M3 3.5V13a1.5 1.5 0 0 0 1.5 1.5H13v-3"/></symbol>
    <symbol id="i-evaluation" viewBox="0 0 16 16"><path d="M2.5 13.5h11M4.5 11V8.5M8 11V5M11.5 11V3"/></symbol>
    <symbol id="i-system" viewBox="0 0 16 16"><path d="M2.5 4.5h5.5M11 4.5h2.5M2.5 11.5H5M8 11.5h5.5"/><circle cx="9.5" cy="4.5" r="1.5"/><circle cx="6.5" cy="11.5" r="1.5"/></symbol>
    <symbol id="i-help" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M6.3 6.3a1.8 1.8 0 1 1 2.5 1.6c-.5.2-.8.6-.8 1.1v.4"/><circle cx="8" cy="11.4" r=".6" fill="currentColor" stroke="none"/></symbol>
  </svg>
  <div class="shell">
    <header class="rail" id="rail">
      <a class="name" href="/">CFR console</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="rail-nav" data-menu>
        <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg><span class="visually-hidden">Menu</span>
      </button>
      <nav id="rail-nav" aria-label="Areas">
        <ul>
          {% for path, label in areas %}
          <li><a class="area" href="{{ path }}"{% if current == path %} aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#i-{{ 'pipeline' if path == '/' else path[1:] }}"/></svg><span>{{ label }}</span></a></li>
          {% endfor %}
        </ul>
      </nav>
      <div class="foot">
        {% if running %}<a class="running" href="/jobs?status=running"><span class="pill running">{{ running }}</span> running</a>{% endif %}
        <p class="release">New cases use<b class="mono">{{ release_id }}</b></p>
        <a href="{{ grafana_url }}" target="_blank" rel="noopener">Grafana <svg class="icon" aria-hidden="true"><use href="#i-external"/></svg><span class="visually-hidden">(opens a new tab)</span></a>
        <button type="button" data-theme-toggle aria-label="Switch theme"><svg class="icon" aria-hidden="true"><use href="#i-theme"/></svg><span data-theme-label>Theme</span></button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      {% block main %}{% endblock %}
    </main>
  </div>
</body>
</html>
