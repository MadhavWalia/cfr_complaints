{% extends "base.html" %}
{% block title %}Pipeline{% endblock %}
{% block main %}
<div class="head">
  <h1>Pipeline</h1>
  <div class="actions">
    <a class="btn secondary cta" href="/intake">Admit Cases</a>
    {% if worker %}<a class="btn primary cta" href="/jobs/{{ worker.id }}">Stop Worker</a>
    {% else %}<a class="btn primary cta" href="/system#system.worker">Start Worker</a>{% endif %}
  </div>
</div>
{% include "_pipeline_status.html" %}
<section class="section" aria-labelledby="journal-h">
  <h2 id="journal-h">Journal</h2>
  {% include "_journal.html" %}
  <p class="more"><a href="/jobs">All jobs</a></p>
</section>
{% endblock %}
