[project]
name = "cfr-v2"
version = "0.1.0"
description = "CFR Complaint Intelligence V2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13,<3",
    # Postgres driver: psycopg 3 (needs libpq on the host) or psycopg2 via the extra
    # below; no SQLAlchemy, Alembic or DBOS (quarantined upstream, LDR-0011).
    "psycopg>=3.2",
    "boto3>=1.35",
    "pyyaml>=6.0",
    # Pinned to the line ee-logging is compatible with (see cfr-v1/requirements.txt).
    "opentelemetry-api==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-instrumentation-httpx==0.60b1",
]

[project.optional-dependencies]
# Hosts without libpq: psycopg2-binary bundles it (select with CFR_DB_DRIVER=psycopg2).
psycopg2 = ["psycopg2-binary>=2.9"]
# Private packages from the internal Artifactory; the code degrades gracefully without them.
enterprise = [
    "safechain>=2.0.0",
    "ee-config>=2.0.0",
    "ee-utils[auth,redaction]>=2.0.0",
    "ee-logging>=2.0.0",
    # C01 BigQuery source (port of cfr-v1/src/sql/fetch_client_prod.py); brings google-auth.
    "google-cloud-bigquery>=3.25",
    "google-auth>=2.56.1",
    "db-dtypes>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "moto[s3]>=5",
    # Dev/CI test both drivers; psycopg-binary supplies libpq for psycopg 3.
    "psycopg[binary]>=3.2",
    "psycopg2-binary>=2.9",
    # Dev-only OTLP export to the local collector when ee-logging is absent (LDR-0012, OQ-25);
    # pinned to the OTel line ee-logging requires.
    "opentelemetry-exporter-otlp-proto-http==1.39.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfr_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "unit: fast, offline, no external services (default)",
    "db: needs the local Postgres from docker-compose (skipped if unreachable)",
    "integration: requires live services/env (opt-in)",
    "slow: long-running",
]

[tool.coverage.run]
source = ["src/cfr_v2"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
