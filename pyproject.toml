[project]
name = "cfr-v2"
version = "0.1.0"
description = "CFR Complaint Intelligence V2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "dbos>=3.3,<4",
    "boto3>=1.35",
    # Pinned to the line ee-logging is compatible with (see cfr-v1/requirements.txt).
    "opentelemetry-api==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-instrumentation-httpx==0.60b1",
]

[project.optional-dependencies]
# Private packages from the internal Artifactory; the code degrades gracefully without them.
enterprise = [
    "safechain>=2.0.0",
    "ee-config>=2.0.0",
    "ee-utils[auth,redaction]>=2.0.0",
    "ee-logging>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "moto[s3]>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfr_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "unit: fast, offline, no external services (default)",
    "db: needs the local Postgres from docker-compose (skipped if unreachable)",
    "integration: requires live services/env (opt-in)",
    "slow: long-running",
]

[tool.coverage.run]
source = ["src/cfr_v2"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
