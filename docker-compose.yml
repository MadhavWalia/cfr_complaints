# Local, dev-only services for CFR V2. Not for production use.
#   docker compose up -d                            start Postgres and RustFS
#   docker compose --profile observability up -d    also start the telemetry stack (LDR-0012)
#   docker compose down -v                          stop and delete their data
services:
  postgres:
    image: postgres:16.6
    # Room for per-process pools sized per workflow slot, times several worker processes (P6).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: cfr
      POSTGRES_PASSWORD: cfr
      POSTGRES_DB: postgres
    ports:
      - "${CFR_PG_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfr -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible store standing in for the enterprise S3 endpoint (LDR-0009).
  # Single /data volume: RustFS skips its multi-disk checks, and the image already
  # owns /data as its non-root user (uid 10001), so no permission helper is needed.
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: cfr-dev
      RUSTFS_SECRET_KEY: cfr-dev-secret
    ports:
      - "${CFR_S3_PORT:-9000}:9000"   # S3 API
      - "${CFR_S3_CONSOLE_PORT:-9001}:9001"   # web console
    volumes:
      - rustfs-data:/data
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -- Telemetry (profile "observability"), ported from V1 ------------------------
  # app -> OTel Collector -> Tempo (traces) + Loki (logs) + Prometheus (metrics) -> Grafana.
  # Apps export here when ee-logging is absent and CFR_OTLP_ENDPOINT=http://localhost:4318.
  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana queries this)
    volumes:
      - ./docker/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.2.1
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"   # Loki HTTP API (Grafana queries this)
    volumes:
      - ./docker/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    ports:
      - "9090:9090"   # Prometheus HTTP API (Grafana queries this)
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/collector.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver (CFR_OTLP_ENDPOINT)
    volumes:
      - ./docker/observability/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    depends_on:
      - tempo
      - loki
      - prometheus

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      # Dev-only: no login, everyone is an admin.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - tempo
      - loki
      - prometheus

volumes:
  pg-data:
  rustfs-data:
  tempo-data:
  loki-data:
  prometheus-data:
