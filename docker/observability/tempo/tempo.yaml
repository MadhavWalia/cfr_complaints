# Minimal, dev-only Tempo config: OTLP in, local disk out.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Cut blocks quickly so traces show up in Grafana without a long wait.
  max_block_duration: 5m

compactor:
  compaction:
    # Dev retention: long enough to compare the batches of a build that runs for hours.
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  # To apply globally, configure under global overrides or per-tenant
  max_bytes_per_trace: 50000000